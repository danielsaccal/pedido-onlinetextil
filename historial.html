<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>OnLineTextil — Historial de pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --purple:#3D2B4E; --purple-dark:#2A1D36; --gold:#F5D470; --gold-dark:#DFB94A;
  --cream:#F5F3EF; --white:#FFFFFF; --ink:#2A2320; --sage:#748265; --line:#DCD4C4;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Work Sans',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
header.top{background:var(--purple);color:var(--cream);padding:24px 16px 18px;text-align:center;position:relative;}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:6px;background-image:repeating-linear-gradient(90deg,var(--gold) 0 10px, transparent 10px 20px);}
header.top h1{font-family:'Fraunces',serif;color:var(--cream);font-size:1.5rem;margin:0 0 4px;font-weight:600;}
header.top p{margin:0;font-size:0.8rem;opacity:0.85;}
.app{max-width:840px;margin:0 auto;padding:20px 16px 60px;}
.search-wrap{margin-bottom:16px;}
.search-wrap input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);font-size:0.95rem;background:var(--white);}
.pedido{background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.pedido-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;}
.pedido-head .num{font-family:'Fraunces',serif;font-weight:600;color:var(--purple);font-size:1.1rem;}
.pedido-head .meta{font-size:0.78rem;color:#6B6258;}
.pedido-head .tot{font-family:'IBM Plex Mono';font-weight:600;color:var(--purple);}
.pedido-body{display:none;border-top:1px dashed var(--line);padding:14px 18px;font-size:0.85rem;}
.pedido.open .pedido-body{display:block;}
.pedido-body table{width:100%;border-collapse:collapse;margin-top:8px;}
.pedido-body td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top;}
.pedido-body td.n{text-align:right;font-family:'IBM Plex Mono';white-space:nowrap;}
.cliente-info{margin-bottom:8px;line-height:1.5;}
.cliente-info b{color:var(--purple);}
.empty, .loading{text-align:center;color:#8A8072;padding:40px 10px;}
.chev{transition:transform .2s;color:var(--purple);}
.pedido.open .chev{transform:rotate(180deg);}
</style>
</head>
<body>
<header class="top">
  <h1>Historial de pedidos</h1>
  <p>OnLineTextil · onlinetextil.com.ar</p>
</header>
<div class="app">
  <div class="search-wrap">
    <input type="text" id="buscador" placeholder="Buscar por N° de pedido, nombre o SKU...">
  </div>
  <div id="lista"><p class="loading">Cargando pedidos...</p></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCE0N4d-Hn_1S0X1B_LsiEvFtX-93LWn3A",
  authDomain: "catalogo-onlinetextil.firebaseapp.com",
  projectId: "catalogo-onlinetextil",
  storageBucket: "catalogo-onlinetextil.firebasestorage.app",
  messagingSenderId: "380063692818",
  appId: "1:380063692818:web:9d3bcfee44bf36c3d780cb",
  measurementId: "G-RD0FZ7FCS4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let pedidos = [];

function formatPrice(n){
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function render(filtro){
  filtro = (filtro||'').trim().toLowerCase();
  const cont = document.getElementById('lista');
  const filtrados = pedidos.filter(p => {
    if(!filtro) return true;
    const haystack = [
      p.numero, p.cliente?.nombre, p.cliente?.apellido,
      ...(p.items||[]).map(i => i.sku + ' ' + i.nombreProducto)
    ].join(' ').toLowerCase();
    return haystack.includes(filtro);
  });

  if(filtrados.length === 0){
    cont.innerHTML = '<p class="empty">No hay pedidos que coincidan.</p>';
    return;
  }

  cont.innerHTML = filtrados.map(p => {
    const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-AR') : '';
    const itemsRows = (p.items||[]).map(i => `
      <tr>
        <td>${i.cantidad} × ${i.sku}<br><span style="color:#8A8072;font-size:0.78rem;">${i.nombreProducto||''} — ${i.desc||''}</span>${i.nota ? `<br><span style="color:var(--sage);font-size:0.75rem;">Nota: ${i.nota}</span>` : ''}</td>
        <td class="n">${formatPrice(i.cantidad * i.precio)}</td>
      </tr>`).join('');
    return `
      <div class="pedido" id="p-${p.numero}">
        <div class="pedido-head" onclick="document.getElementById('p-${p.numero}').classList.toggle('open')">
          <div>
            <div class="num">${p.numero}</div>
            <div class="meta">${p.cliente?.nombre||''} ${p.cliente?.apellido||''} · ${fecha}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="tot">${formatPrice(p.total)}</div>
            <span class="chev">▾</span>
          </div>
        </div>
        <div class="pedido-body">
          <div class="cliente-info">
            <b>CUIT:</b> ${p.cliente?.cuit||''} &nbsp; <b>Tel:</b> ${p.cliente?.telefono||''} &nbsp; <b>Email:</b> ${p.cliente?.email||''}<br>
            <b>Transporte:</b> ${p.cliente?.transporte||''}
            ${p.observaciones ? `<br><b>Observaciones:</b> ${p.observaciones}` : ''}
          </div>
          <table>${itemsRows}</table>
          ${p.descuentoPct > 0 ? `<p style="text-align:right;margin:6px 0 0;">Subtotal: ${formatPrice(p.subtotal)} — Descuento ${p.descuentoPct}%</p>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('buscador').addEventListener('input', e => render(e.target.value));

db.collection('pedidos').orderBy('fecha', 'desc').get().then(snap => {
  pedidos = snap.docs.map(d => d.data());
  render('');
}).catch(err => {
  document.getElementById('lista').innerHTML = '<p class="empty">No se pudo cargar el historial: ' + err.message + '</p>';
});
</script>
</body>
</html>
